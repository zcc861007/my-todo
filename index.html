<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待办事项</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .app {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      width: 100%;
      max-width: 520px;
      overflow: hidden;
    }

    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      padding: 28px 28px 20px;
    }

    .header h1 {
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: 2px;
      margin-bottom: 6px;
    }

    .header .summary {
      font-size: 0.88rem;
      opacity: 0.85;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 20px 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .input-area input {
      flex: 1;
      border: 2px solid #e0e0e0;
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.2s;
    }

    .input-area input:focus { border-color: #667eea; }

    .input-area button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 10px 20px;
      font-size: 0.95rem;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      white-space: nowrap;
    }

    .input-area button:hover { opacity: 0.9; }
    .input-area button:active { transform: scale(0.97); }

    .filters {
      display: flex;
      gap: 6px;
      padding: 12px 24px;
      border-bottom: 1px solid #f0f0f0;
    }

    .filter-btn {
      background: none;
      border: 1.5px solid #e0e0e0;
      border-radius: 20px;
      padding: 5px 14px;
      font-size: 0.82rem;
      cursor: pointer;
      color: #666;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
      color: #fff;
    }

    .list {
      list-style: none;
      min-height: 60px;
      max-height: 400px;
      overflow-y: auto;
    }

    .list:empty::after {
      content: "暂无待办事项";
      display: block;
      text-align: center;
      color: #bbb;
      padding: 40px 0;
      font-size: 0.9rem;
    }

    .item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 24px;
      border-bottom: 1px solid #f7f7f7;
      transition: background 0.15s;
      animation: fadeIn 0.2s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .item:last-child { border-bottom: none; }
    .item:hover { background: #fafafa; }

    .item.done .text { text-decoration: line-through; color: #bbb; }

    .checkbox {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #d0d0d0;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: all 0.2s;
    }

    .item.done .checkbox {
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-color: transparent;
    }

    .checkbox svg { display: none; }
    .item.done .checkbox svg { display: block; }

    .text {
      flex: 1;
      font-size: 0.95rem;
      color: #333;
      word-break: break-all;
      outline: none;
    }

    .text[contenteditable="true"] {
      background: #f0edff;
      border-radius: 6px;
      padding: 2px 6px;
    }

    .actions {
      display: flex;
      gap: 6px;
      flex-shrink: 0;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .item:hover .actions { opacity: 1; }

    .btn-icon {
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      border-radius: 6px;
      color: #aaa;
      font-size: 1rem;
      transition: color 0.15s, background 0.15s;
      line-height: 1;
    }

    .btn-icon:hover { background: #f0f0f0; color: #555; }
    .btn-icon.del:hover { color: #e55; background: #fff0f0; }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 24px;
      background: #fafafa;
      border-top: 1px solid #f0f0f0;
      font-size: 0.82rem;
      color: #999;
    }

    .clear-btn {
      background: none;
      border: none;
      color: #e55;
      cursor: pointer;
      font-size: 0.82rem;
      padding: 0;
    }

    .clear-btn:hover { text-decoration: underline; }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>待办事项</h1>
    <div class="summary" id="summary">加载中...</div>
  </div>

  <div class="input-area">
    <input id="newTask" type="text" placeholder="输入新的待办事项，按 Enter 添加" maxlength="200" />
    <button onclick="addTask()">+ 添加</button>
  </div>

  <div class="filters">
    <button class="filter-btn active" data-filter="all" onclick="setFilter('all')">全部</button>
    <button class="filter-btn" data-filter="active" onclick="setFilter('active')">未完成</button>
    <button class="filter-btn" data-filter="done" onclick="setFilter('done')">已完成</button>
  </div>

  <ul class="list" id="list"></ul>

  <div class="footer">
    <span id="footerInfo"></span>
    <button class="clear-btn" onclick="clearDone()">清除已完成</button>
  </div>
</div>

<script>
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let filter = 'all';

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
  }

  function render() {
    const list = document.getElementById('list');
    const visible = tasks.filter(t =>
      filter === 'all' ? true : filter === 'done' ? t.done : !t.done
    );

    list.innerHTML = visible.map(t => `
      <li class="item${t.done ? ' done' : ''}" id="item-${t.id}">
        <div class="checkbox" onclick="toggle(${t.id})" title="切换完成状态">
          <svg width="12" height="10" viewBox="0 0 12 10" fill="none">
            <polyline points="1,5 4.5,8.5 11,1" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>
        <span class="text" id="text-${t.id}">${escHtml(t.text)}</span>
        <div class="actions">
          <button class="btn-icon" onclick="startEdit(${t.id})" title="编辑">✏️</button>
          <button class="btn-icon del" onclick="remove(${t.id})" title="删除">🗑️</button>
        </div>
      </li>
    `).join('');

    const total = tasks.length;
    const done = tasks.filter(t => t.done).length;
    const active = total - done;
    document.getElementById('summary').textContent =
      `共 ${total} 项 · 已完成 ${done} 项 · 剩余 ${active} 项`;
    document.getElementById('footerInfo').textContent =
      `${active} 项未完成`;

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.filter === filter);
    });
  }

  function escHtml(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function addTask() {
    const input = document.getElementById('newTask');
    const text = input.value.trim();
    if (!text) return;
    tasks.unshift({ id: Date.now(), text, done: false });
    input.value = '';
    save(); render();
  }

  function toggle(id) {
    const t = tasks.find(t => t.id === id);
    if (t) { t.done = !t.done; save(); render(); }
  }

  function remove(id) {
    tasks = tasks.filter(t => t.id !== id);
    save(); render();
  }

  function startEdit(id) {
    const t = tasks.find(t => t.id === id);
    if (!t) return;
    const span = document.getElementById('text-' + id);
    span.contentEditable = 'true';
    span.focus();
    // move cursor to end
    const range = document.createRange();
    range.selectNodeContents(span);
    range.collapse(false);
    window.getSelection().removeAllRanges();
    window.getSelection().addRange(range);

    function finish() {
      span.contentEditable = 'false';
      const newText = span.textContent.trim();
      if (newText) { t.text = newText; save(); }
      render();
    }
    span.onblur = finish;
    span.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); span.blur(); } };
  }

  function clearDone() {
    tasks = tasks.filter(t => !t.done);
    save(); render();
  }

  function setFilter(f) {
    filter = f;
    render();
  }

  document.getElementById('newTask').addEventListener('keydown', e => {
    if (e.key === 'Enter') addTask();
  });

  render();
</script>
</body>
</html>
